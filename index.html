<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Login Screen (With Animations)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            background-color: black;
            position: relative;
        }

        .falling-block {
            position: absolute;
            width: 30px;
            height: 30px;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff4757, #1e90ff, #2ed573, #ffa502);
            -webkit-background-clip: text;
            color: transparent;
            text-transform: uppercase;
            font-weight: bold;
        }

        .clock {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffa502;
        }

        .tetris-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            animation: rotateLogo 4s linear infinite;
        }

        @keyframes rotateLogo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tetris-logo .block {
            width: 50px;
            height: 50px;
            background-color: #ff4757;
            margin: 2px;
        }

        .tetris-logo .block:nth-child(2) { background-color: #2ed573; }
        .tetris-logo .block:nth-child(3) { background-color: #1e90ff; }
        .tetris-logo .block:nth-child(4) { background-color: #ffa502; }

        .login-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            border: 2px solid #ffa502;
        }

        .login-box label {
            display: block;
            margin: 8px 0;
            font-weight: bold;
            color: #ffa502;
        }

        .login-box input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 2px solid #ffa502;
            border-radius: 5px;
            background: #222;
            color: white;
        }

        .login-box button {
            padding: 10px;
            background: linear-gradient(90deg, #ff4757, #1e90ff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .login-box button:hover {
            background: linear-gradient(90deg, #1e90ff, #ff4757);
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to TETRIS!</h1>

    <div class="clock" id="liveClock">--:--:--</div>

    <div class="tetris-logo" onclick="toggleLoginBox()">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
    </div>

    <div class="login-box hidden" id="loginBox">
        <label for="username">Username:</label>
        <input type="text" id="username">
        <label for="password">Password:</label>
        <input type="password" id="password">
        <button type="button" onclick="handleLogin()">Log In</button>
    </div>
</div>

<script>
const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#7bed9f'];

function createFallingBlock() {
    const block = document.createElement('div');
    block.classList.add('falling-block');
    block.style.left = Math.random() * 100 + 'vw';
    block.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    block.style.animationDuration = (Math.random() * 3 + 2) + 's';
    document.body.appendChild(block);
    setTimeout(() => { block.remove(); }, 5000);
}
setInterval(createFallingBlock, 300);

function toggleLoginBox() {
    document.getElementById('loginBox').classList.toggle('hidden');
}

function handleLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (username === 'admin' && password === 'admin') {
        alert('Login successful! Redirecting...');
        window.location.href = 'table.html';
    } else {
        alert('Invalid credentials! Try again.');
    }
}

function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-US');
}
setInterval(updateClock, 1000);
updateClock();

document.addEventListener('keydown', (event) => {
    if (event.key.toLowerCase() === 'h') {
        document.getElementById('loginBox').classList.toggle('hidden');
    }
});
</script>

</body>
</html>
